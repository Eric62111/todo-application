
{% extends 'tasks/base.html' %}

{% block title %}Delete Task{% endblock %}

{% block content %}

<h1>Delete Task</h1>

<p>Are you sure you want to delete this task?</p>

<div class="task">
    <h3>{{ task.title }}</h3>
    <p>{{ task.description|default:"No description provided." }}</p>
</div>

<form method="POST">

    {% csrf_token %}

    <button type="submit" class="btn delete-btn">
        Confirm Delete
    </button>

    <a href="{% url 'tasks:task_detail' task.pk %}"
       class="btn cancel-btn">
        Cancel
    </a>

</form>

{% endblock %}
