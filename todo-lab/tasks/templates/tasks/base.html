
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Todo Application{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            color: #333;
        }

        nav {
            background: #26354a;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        nav strong {
            color: white;
            font-size: 22px;
        }

        .container {
            max-width: 850px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 12px #00000010;
        }

        h1 {
            color: #26354a;
        }

        .btn {
            display: inline-block;
            padding: 10px 16px;
            background: #2878d0;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px 3px;
        }

        .delete-btn {
            background: #dc3545;
        }

        .cancel-btn {
            background: #6c757d;
        }

        .task {
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 7px;
            margin: 15px 0;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 11px;
            margin: 8px 0 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        input[type="checkbox"] {
            margin: 10px;
        }

        .errorlist {
            color: red;
        }

        .completed {
            color: green;
        }

        .pending {
            color: #d28b00;
        }
    </style>
</head>

<body>

<nav>
    <strong>My Todo App</strong>

    <div>
        <a href="{% url 'tasks:task_list' %}">Home</a>
        <a href="{% url 'tasks:task_create' %}">Add Task</a>
    </div>
</nav>

<div class="container">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
